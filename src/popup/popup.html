<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>getFran AdBlock</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1b1b1b;
        --muted: #6b6b6b;
        --line: #dcdcdc;
        --bg: #fff;
        --accent: #1a73e8;
        --off: #b3261e;
        --update-bg: #fdecea;
        --code-bg: #f1f3f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8e8e8;
          --muted: #9a9a9a;
          --line: #3a3a3a;
          --bg: #202124;
          --accent: #8ab4f8;
          --off: #f28b82;
          --update-bg: #3a2322;
          --code-bg: #2d2e31;
        }
      }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
      }
      header img {
        width: 24px;
        height: 24px;
        border-radius: 4px;
      }
      header strong {
        font-size: 14px;
      }
      nav {
        display: flex;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        flex: 1;
        padding: 7px 0 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        margin-bottom: -1px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button[aria-selected='true'] {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      nav .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-left: 6px;
        border-radius: 50%;
        background: var(--off);
        vertical-align: middle;
      }
      nav .dot[hidden] {
        display: none;
      }
      main {
        padding: 12px;
      }
      section[hidden] {
        display: none;
      }
      #update {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: -4px 0 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--update-bg);
        color: var(--off);
      }
      #update[hidden] {
        display: none;
      }
      #update button {
        border-color: var(--off);
        color: var(--off);
        white-space: nowrap;
      }
      .site {
        font-weight: 600;
        word-break: break-all;
      }
      .state {
        color: var(--muted);
        margin: 2px 0 10px;
      }
      .state.off {
        color: var(--off);
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 16px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
        border-top: 1px solid var(--line);
      }
      #list li button {
        padding: 2px 8px;
      }
      .empty {
        color: var(--muted);
      }
      #changelog {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 400px;
        overflow-y: auto;
      }
      .entry {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .entry:first-child {
        padding-top: 0;
        border-top: 0;
      }
      .entry-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 3px;
      }
      .entry-head .version {
        font-weight: 600;
      }
      .entry-head .date {
        color: var(--muted);
        font-size: 12px;
      }
      .entry-head .installed {
        margin-left: auto;
        padding: 0 7px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        color: var(--accent);
        font-size: 11px;
        line-height: 16px;
      }
      .entry ul {
        list-style: disc;
        margin: 0;
        padding-left: 16px;
      }
      .entry li {
        padding: 1px 0;
      }
      code {
        font: 12px/1 ui-monospace, Consolas, monospace;
        padding: 1px 4px;
        border-radius: 3px;
        background: var(--code-bg);
      }
      .more {
        margin: 10px 0 0;
        font-size: 12px;
      }
      .more a {
        color: var(--muted);
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      footer a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" alt="" />
      <strong>getFran AdBlock</strong>
    </header>
    <nav role="tablist">
      <button type="button" role="tab" id="tab-site" aria-selected="true" aria-controls="site">This site</button>
      <button type="button" role="tab" id="tab-news" aria-selected="false" aria-controls="news">What's new<span class="dot" id="news-dot" hidden></span></button>
    </nav>
    <main>
      <div id="update" hidden>
        <span></span>
        <button type="button">Download</button>
      </div>
      <section id="site" role="tabpanel">
        <div id="current"></div>
        <h2>Switched off on</h2>
        <ul id="list"></ul>
      </section>
      <section id="news" role="tabpanel" hidden>
        <ol id="changelog"></ol>
        <p class="more"><a id="full" href="#">Full changelog and releases on GitHub</a></p>
      </section>
    </main>
    <footer>
      <span id="version"></span>
      <a id="check" href="#">Check for updates</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
